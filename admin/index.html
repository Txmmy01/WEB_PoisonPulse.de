<!doctype html>
<html lang="de" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoisonPulse · Admin</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--a:#b6ff36;--bg:#090d0b;--panel:#111814;--text:#f2f6ef;--muted:#9ba99b;--line:#28342b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px 'DM Sans',sans-serif}.wrap{max-width:1120px;width:calc(100% - 36px);margin:auto}header{border-bottom:1px solid var(--line);padding:20px 0}.brand{font:900 28px 'Barlow Condensed';text-transform:uppercase}.brand b,h1 span{color:var(--a)}main{padding:45px 0}h1,h2,h3{font-family:'Barlow Condensed';text-transform:uppercase;margin:0}h1{font-size:52px}h2{font-size:28px;margin-bottom:16px}.muted{color:var(--muted);line-height:1.6}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tabs button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700}.tabs button.active,.btn.primary{background:var(--a);border-color:var(--a);color:#10170b}input,textarea,select{width:100%;margin:7px 0 14px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0b110d;color:var(--text);font:inherit}label{font-size:13px;font-weight:700;color:var(--muted)}textarea{min-height:80px;resize:vertical}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--muted);margin-top:4px}.status{color:var(--a);min-height:24px}.hidden{display:none!important}.hint{font-size:13px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:25px 0}h1{font-size:40px}}
</style></head><body><header><div class="wrap"><a class="brand" href="../index.html">POISON<b>PULSE.</b> <span style="font-size:16px;color:var(--muted)">ADMIN</span></a></div></header>
<main class="wrap"><section id="login-panel" class="panel"><h1>ADMIN <span>LOGIN.</span></h1><p class="muted">Melde dich mit deinen KVM-Zugangsdaten aus der .env-Datei an.</p><form id="login"><label>BENUTZERNAME</label><input name="username" autocomplete="username" required><label>PASSWORT</label><input name="password" type="password" autocomplete="current-password" required><button class="btn primary">ANMELDEN</button></form><p id="login-status" class="status"></p></section>
<section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><div class="muted">POISONPULSE.DE · CONTROL ROOM</div><h1>DASH<span>BOARD.</span></h1></div><button id="logout" class="btn">ABMELDEN</button></div><div class="tabs"><button class="active" data-tab="news">NEWS</button><button data-tab="members">CLAN</button><button data-tab="applications">BEWERBUNGEN</button><button data-tab="calendar">ADVENTSKALENDER</button></div>
<section id="tab-news" class="panel"><h2>NEWS VERWALTEN</h2><form id="news-form"><input type="hidden" name="id"><div class="grid"><div><label>TITEL</label><input name="title" required maxlength="120"></div><div><label>KATEGORIE</label><input name="category" value="Community"></div></div><label>KURZTEXT</label><textarea name="excerpt" required maxlength="300"></textarea><label>DETAILTEXT</label><textarea name="body"></textarea><label><input name="published" type="checkbox" style="width:auto"> Sofort veröffentlichen</label><button class="btn primary">SPEICHERN</button> <button type="button" class="btn" data-reset="news-form">NEU</button></form><p id="news-status" class="status"></p><div id="news-list"></div></section>
<section id="tab-members" class="panel hidden"><h2>CLANMITGLIEDER</h2><form id="member-form"><input type="hidden" name="id"><div class="grid"><div><label>MINECRAFT-NAME</label><input name="minecraft_name" required maxlength="16"></div><div><label>RANG</label><select name="rank"><option>Owner</option><option>Co-Owner</option><option>Admin</option><option>Moderator</option><option>Member</option><option>Trial</option></select></div></div><label>BESCHREIBUNG</label><textarea name="description"></textarea><div class="grid"><label><input name="active" type="checkbox" checked style="width:auto"> Öffentlich anzeigen</label><div><label>REIHENFOLGE</label><input name="sort_order" type="number" value="100"></div></div><button class="btn primary">SPEICHERN</button> <button type="button" class="btn" data-reset="member-form">NEU</button></form><p id="member-status" class="status"></p><div id="member-list"></div></section>
<section id="tab-applications" class="panel hidden"><h2>BEWERBUNGEN</h2><div id="application-list"></div></section>
<section id="tab-calendar" class="panel hidden"><h2>ADVENTSKALENDER</h2><form id="calendar-form"><input type="hidden" name="id"><div class="grid"><div><label>TÜRCHEN (1–24)</label><input name="day" type="number" min="1" max="24" required></div><div><label>VERÖFFENTLICHUNGSDATUM</label><input name="reveal_at" type="date" required></div></div><label>TITEL</label><input name="title" required><label>INHALT / GEWINN</label><textarea name="content" required></textarea><label><input name="published" type="checkbox" style="width:auto"> Veröffentlichen</label><button class="btn primary">SPEICHERN</button> <button type="button" class="btn" data-reset="calendar-form">NEU</button></form><p id="calendar-status" class="status"></p><div id="calendar-list"></div></section></section></main>
<script>
(()=>{const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let tab="news",cache={};
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Serverfehler");return d}
function show(on){$("#login-panel").classList.toggle("hidden",on);$("#dashboard").classList.toggle("hidden",!on)}
async function check(){try{const s=await api("/api/session");show(s.authenticated);if(s.authenticated)await refresh()}catch{show(false)}}
$("#login").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));try{await api("/api/login",{method:"POST",body:JSON.stringify(f)});$("#login-status").textContent="";show(true);await refresh()}catch(err){$("#login-status").textContent=err.message}};
$("#logout").onclick=async()=>{await api("/api/logout",{method:"POST"});show(false)};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll('[id^="tab-"]').forEach(x=>x.classList.toggle("hidden",x.id!=="tab-"+tab));refresh()});
document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{const f=$("#"+b.dataset.reset);f.reset();f.elements.id.value=""});
function edit(form,row){Object.entries(row).forEach(([k,v])=>{if(form.elements[k]){if(form.elements[k].type==="checkbox")form.elements[k].checked=!!v;else form.elements[k].value=v??""}});form.scrollIntoView({behavior:"smooth",block:"start"})}
async function remove(kind,id){if(!confirm("Eintrag wirklich löschen?"))return;await api("/api/admin/"+kind+"/"+id,{method:"DELETE"});refresh()}
function render(target,items,kind,formId){cache[kind]=items;$(target).innerHTML=items.map(r=>'<div class="row"><div><strong>'+esc(r.title||r.minecraft_name||("Türchen "+r.day)||r.discord_name)+'</strong><small>'+esc(r.category||r.rank||r.status||r.reveal_at||"")+'</small></div><div>'+(formId?'<button class="btn" data-edit="'+r.id+'">BEARBEITEN</button> ':"")+'<button class="btn" data-delete="'+r.id+'">LÖSCHEN</button></div></div>').join("")||'<p class="muted">Noch keine Einträge.</p>';$(target).querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit($("#"+formId),items.find(x=>x.id==b.dataset.edit)));$(target).querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>remove(kind,b.dataset.delete))}
async function refresh(){try{if(tab==="applications"){const a=await api("/api/admin/applications");$("#application-list").innerHTML=a.map(r=>'<div class="row"><div><strong>'+esc(r.minecraft_name)+' · '+esc(r.discord_name)+'</strong><small>'+esc(r.message)+' · '+esc(r.created_at)+'</small></div><select data-status="'+r.id+'"><option value="new">Neu</option><option value="reviewing">In Prüfung</option><option value="accepted">Angenommen</option><option value="declined">Abgelehnt</option></select></div>').join("")||'<p class="muted">Noch keine Bewerbungen.</p>';$("#application-list").querySelectorAll("[data-status]").forEach(s=>{s.value=a.find(x=>x.id==s.dataset.status).status;s.onchange=()=>api("/api/admin/applications/"+s.dataset.status,{method:"PATCH",body:JSON.stringify({status:s.value})})})}else{const data=await api("/api/admin/"+tab);const ids={news:["#news-list","news-form"],members:["#member-list","member-form"],calendar:["#calendar-list","calendar-form"]};render(ids[tab][0],data,tab,ids[tab][1])}}catch(e){alert(e.message)}}
async function save(form,kind,statusId){const o=Object.fromEntries(new FormData(form));o.id=o.id?Number(o.id):undefined;for(const k of ["published","active"])if(form.elements[k])o[k]=form.elements[k].checked;for(const k of ["day","sort_order"])if(o[k]!==undefined)o[k]=Number(o[k]);try{await api("/api/admin/"+kind,{method:"POST",body:JSON.stringify(o)});$("#"+statusId).textContent="Gespeichert.";form.reset();form.elements.id.value="";await refresh()}catch(e){$("#"+statusId).textContent=e.message}}
$("#news-form").onsubmit=e=>{e.preventDefault();save(e.currentTarget,"news","news-status")};$("#member-form").onsubmit=e=>{e.preventDefault();save(e.currentTarget,"members","member-status")};$("#calendar-form").onsubmit=e=>{e.preventDefault();save(e.currentTarget,"calendar","calendar-status")};
check();
})();
</script></body></html>
